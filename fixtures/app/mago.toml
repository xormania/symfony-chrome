# Native Mago checks for the fixture application and, through the Composer path
# symlinks under vendor/xormania, the two packages. Adapted from mago-serena_v2-poc.
version = "1.58.2"
php-version = "8.4"
threads = 4

[source]
paths = ["src", "tests", "vendor/xormania/chrome-bundle/src", "vendor/xormania/chrome-devtools-bundle/src"]
includes = ["vendor"]
excludes = ["var", "public/assets"]

[linter]
integrations = ["symfony", "phpunit"]

[linter.rules]
no-debug-symbols = { enabled = true, level = "error" }
no-redundant-parentheses = { enabled = true }

[formatter]
print-width = 120

# Runtime-to-development dependencies are perimeter restrictions, not structural rules.

[[guard.perimeter.restrictions]]
dependency = "Symfony\\Bundle\\WebProfilerBundle\\**"
deny-from = ["Xormania\\ChromeBundle\\**"]
reason = "Development diagnostics belong to chrome-devtools-bundle; the runtime bundle installs without them."

[[guard.perimeter.restrictions]]
dependency = "Symfony\\Component\\HttpKernel\\Profiler\\**"
deny-from = ["Xormania\\ChromeBundle\\**"]
reason = "Development diagnostics belong to chrome-devtools-bundle; the runtime bundle installs without them."

[[guard.perimeter.restrictions]]
dependency = "Xormania\\ChromeDevtoolsBundle\\**"
deny-from = ["Xormania\\ChromeBundle\\**"]
reason = "Development diagnostics belong to chrome-devtools-bundle; the runtime bundle installs without them."
