name: Symfony Chrome CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: symfony-chrome-${{ github.event_name }}-${{ github.event.pull_request.number || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Fast contracts and runner controls
        run: ./bin/dev test --suite fast
      - name: Retain fast results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring, dom, xml, curl, zip, pdo_sqlite
          tools: composer:2.10.3
          coverage: none
      - name: Package, kernel, and independent distribution consumers
        run: ./bin/dev test --suite package
      - name: Declared lower framework boundary
        run: ./bin/dev test --suite compatibility
      - name: Retain package results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEV_IMAGE: symfony-chrome-ci:${{ github.run_id }}-${{ github.run_attempt }}
      DEV_SKIP_BUILD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Pull and verify supported xorder parent
        run: ./bin/dev test --suite support --run ci-support
      - name: Build exact development toolchain once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.DEV_IMAGE }}
          build-args: MAGO_BUILD_JOBS=2
          cache-from: type=gha,scope=symfony-chrome-amd64
          cache-to: type=gha,scope=symfony-chrome-amd64,mode=max
      - name: Locked real development environment
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./bin/dev test --suite environment
      - name: Real browser contracts and guard controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./bin/dev test --suite browser
      - name: Real Mate, Mago and Serena contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./bin/dev test --suite tooling
      - name: Retain integration results and build identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring, dom, xml, curl, zip, pdo_sqlite
          tools: composer:2.10.3
          coverage: none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
      - name: Prepare exact native consumer browser
        run: python3 tools/testing/prepare_browser.py --evidence artifacts/consumer-browser
      - name: Pinned UXor consumer and native Live interactions
        run: ./bin/dev test --suite consumer
      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  acceptance:
    name: Symfony Chrome acceptance
    runs-on: ubuntu-latest
    if: always()
    needs: [fast, package, integration, consumer]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download exact workflow-attempt evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ github.run_id }}-${{ github.run_attempt }}'
          path: artifacts-input
      - name: Verify required jobs and exact native result inventory
        env:
          REQUIRED_JOBS: ${{ toJSON(needs) }}
          JOB_SUITES: '{"fast":["fast"],"package":["package","compatibility"],"integration":["support","environment","browser","tooling"],"consumer":["consumer"]}'
        run: >-
          python3 tools/ci/acceptance.py
          --evidence artifacts-input
          --source "$GITHUB_SHA"
          --run "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --manifest tests/manifest.json
