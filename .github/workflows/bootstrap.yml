name: Maintain fixture dependency locks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, mbstring, dom, xml, curl, zip, pdo_sqlite
          tools: composer:2.10.3
          coverage: none
      - name: Explicitly resolve dependencies and retain generated inputs
        run: python3 tools/testing/package.py --bootstrap-locks --evidence artifacts/lock-maintenance
      - name: Retain locks for a reviewed source update
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-fixture-locks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            fixtures/app/composer.lock
            fixtures/app/symfony.lock
            fixtures/consumer/composer.lock
            artifacts/lock-maintenance/
          if-no-files-found: error
          retention-days: 14
